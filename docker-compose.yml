# Opcional: sobe um MySQL pronto para o projeto -> docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: dundersystem-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dundersystem
    ports:
      - "3306:3306"
    volumes:
      - dunder_data:/var/lib/mysql
volumes:
  dunder_data:
